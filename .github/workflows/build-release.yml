name: Build Binaries

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  ANDROID_NDK_VERSION: r26d
  ANDROID_PLATFORM: android-24
  SUPERPOWERED_PATH: external/superpowered

jobs:
  build-android:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64, x86]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.ANDROID_NDK_VERSION }}
          add-to-path: true

      - name: Build dependencies (zlib + TagLib)
        run: |
          set -e
          echo "Building zlib for ${{ matrix.abi }}..."
          export ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME
          export TOOLCHAIN=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64
          case "${{ matrix.abi }}" in
            arm64-v8a) TARGET=aarch64-linux-android ;;
            armeabi-v7a) TARGET=armv7a-linux-androideabi ;;
            x86_64) TARGET=x86_64-linux-android ;;
            x86) TARGET=i686-linux-android ;;
          esac

          git clone --depth=1 https://github.com/madler/zlib.git
          cd zlib
          export CC=$TOOLCHAIN/bin/$TARGET${ANDROID_PLATFORM}-clang
          export AR=$TOOLCHAIN/bin/llvm-ar
          export RANLIB=$TOOLCHAIN/bin/llvm-ranlib
          export CFLAGS="-O2"
          export CXXFLAGS="-O2"
          ./configure --prefix=$GITHUB_WORKSPACE/android-deps --static
          make -j$(nproc)
          make install
          cd ..

          git clone --depth=1 --recursive https://github.com/taglib/taglib.git
          cd taglib
          cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=${{ matrix.abi }} \
                -DANDROID_PLATFORM=${ANDROID_PLATFORM} \
                -DCMAKE_BUILD_TYPE=Release \
                -DBUILD_SHARED_LIBS=OFF \
                -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
                -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/android-deps \
                -DZLIB_LIBRARY=$GITHUB_WORKSPACE/android-deps/lib/libz.a \
                -DZLIB_INCLUDE_DIR=$GITHUB_WORKSPACE/android-deps/include .
          make -j$(nproc)
          make install

      - name: Build amalyzer
        run: |
          set -e
          echo "Building amalyzer for ${{ matrix.abi }}..."
          rm -rf build
          mkdir build && cd build

          case "${{ matrix.abi }}" in
            arm64-v8a) SUPERPOWERED_LIB=$GITHUB_WORKSPACE/${{ env.SUPERPOWERED_PATH }}/lib/libSuperpoweredAndroidarm64-v8a.a ;;
            armeabi-v7a) SUPERPOWERED_LIB=$GITHUB_WORKSPACE/${{ env.SUPERPOWERED_PATH }}/lib/libSuperpoweredAndroidarmeabi-v7a.a ;;
            x86_64) SUPERPOWERED_LIB=$GITHUB_WORKSPACE/${{ env.SUPERPOWERED_PATH }}/lib/libSuperpoweredAndroidX86_64.a ;;
            x86) SUPERPOWERED_LIB=$GITHUB_WORKSPACE/${{ env.SUPERPOWERED_PATH }}/lib/libSuperpoweredAndroidX86.a ;;
          esac

          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=${ANDROID_PLATFORM} \
            -DCMAKE_BUILD_TYPE=Release \
            -DTAGLIB_STATIC_ROOT=$GITHUB_WORKSPACE/android-deps \
            -DZLIB_STATIC=$GITHUB_WORKSPACE/android-deps/lib/libz.a \
            -DSUPERPOWERED_LIB=${SUPERPOWERED_LIB}
          cmake --build . --config Release

      - name: Strip binary
        run: |
          $ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip build/amalyzer

      - name: Package binary (ZIP)
        run: |
          mkdir -p release/amalyzer-${{ matrix.abi }}
          cp build/amalyzer release/amalyzer-${{ matrix.abi }}/
          cp README.md release/amalyzer-${{ matrix.abi }}/ 2>/dev/null || true
          echo "Built for Android ABI: ${{ matrix.abi }}" > release/amalyzer-${{ matrix.abi }}/ANDROID.txt
          cd release/amalyzer-${{ matrix.abi }}
          zip -r ../amalyzer-${{ matrix.abi }}.zip *

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: amalyzer-${{ matrix.abi }}
          path: release/amalyzer-${{ matrix.abi }}.zip

  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git pkg-config zlib1g-dev

      - name: Build amalyzer
        run: |
          echo "Building amalyzer for Linux ${{ matrix.arch }}..."
          rm -rf build
          mkdir build && cd build

          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            export CMAKE_TOOLCHAIN_FILE=""
          fi

          SUPERPOWERED_LIB=$GITHUB_WORKSPACE/${{ env.SUPERPOWERED_PATH }}/lib/libSuperpoweredLinuxX86_64.a
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            SUPERPOWERED_LIB=$GITHUB_WORKSPACE/${{ env.SUPERPOWERED_PATH }}/lib/libSuperpoweredLinuxARM64.a
          fi

          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DSUPERPOWERED_LIB=${SUPERPOWERED_LIB}
          cmake --build . --config Release

      - name: Package binary
        run: |
          mkdir -p release/amalyzer-linux-${{ matrix.arch }}
          cp build/amalyzer release/amalyzer-linux-${{ matrix.arch }}/
          cp README.md release/amalyzer-linux-${{ matrix.arch }}/ 2>/dev/null || true
          cd release/amalyzer-linux-${{ matrix.arch }}
          zip -r ../amalyzer-linux-${{ matrix.arch }}.zip *

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: amalyzer-linux-${{ matrix.arch }}
          path: release/amalyzer-linux-${{ matrix.arch }}.zip
