name: Build Release Binaries (Static)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  ANDROID_NDK_VERSION: r26d
  ANDROID_PLATFORM: android-24

jobs:
  build-linux-x64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git pkg-config

      - name: Build static zlib
        run: |
          git clone --depth=1 https://github.com/madler/zlib.git
          cd zlib
          cmake -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/linux-deps \
                -DBUILD_SHARED_LIBS=OFF .
          make -j$(nproc)
          make install

      - name: Build static TagLib
        run: |
          git clone --depth=1 --recursive https://github.com/taglib/taglib.git
          cd taglib
          cmake -DCMAKE_BUILD_TYPE=Release \
                -DBUILD_SHARED_LIBS=OFF \
                -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
                -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/linux-deps \
                -DZLIB_LIBRARY=$GITHUB_WORKSPACE/linux-deps/lib/libz.a \
                -DZLIB_INCLUDE_DIR=$GITHUB_WORKSPACE/linux-deps/include .
          make -j$(nproc)
          make install

      - name: Build amalyzer
        run: |
          rm -rf build
          mkdir build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DTAGLIB_STATIC_ROOT=$GITHUB_WORKSPACE/linux-deps \
            -DZLIB_STATIC=$GITHUB_WORKSPACE/linux-deps/lib/libz.a
          cmake --build . --config Release

      - name: Package binary
        run: |
          mkdir -p release/amalyzer-linux-x64
          cp build/amalyzer release/amalyzer-linux-x64/
          cp README.md release/amalyzer-linux-x64/ 2>/dev/null || true
          cd release/amalyzer-linux-x64
          zip -r ../amalyzer-linux-x64.zip *

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: amalyzer-linux-x64
          path: release/amalyzer-linux-x64.zip

  build-android:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64, x86]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.ANDROID_NDK_VERSION }}
          add-to-path: true

      - name: Build dependencies (zlib + TagLib)
        run: |
          set -e
          export ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME
          export TOOLCHAIN=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64

          case "${{ matrix.abi }}" in
            arm64-v8a) TARGET=aarch64-linux-android ;;
            armeabi-v7a) TARGET=armv7a-linux-androideabi ;;
            x86_64) TARGET=x86_64-linux-android ;;
            x86) TARGET=i686-linux-android ;;
          esac

          mkdir -p $GITHUB_WORKSPACE/android-deps

          # Build zlib
          git clone --depth=1 https://github.com/madler/zlib.git
          cd zlib
          export CC=$TOOLCHAIN/bin/$TARGET${ANDROID_PLATFORM}-clang
          export AR=$TOOLCHAIN/bin/llvm-ar
          export RANLIB=$TOOLCHAIN/bin/llvm-ranlib
          ./configure --prefix=$GITHUB_WORKSPACE/android-deps --static
          make -j$(nproc)
          make install
          cd ..

          # Build TagLib
          git clone --depth=1 --recursive https://github.com/taglib/taglib.git
          cd taglib
          cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=${{ matrix.abi }} \
                -DANDROID_PLATFORM=${ANDROID_PLATFORM} \
                -DCMAKE_BUILD_TYPE=Release \
                -DBUILD_SHARED_LIBS=OFF \
                -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
                -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/android-deps \
                -DZLIB_LIBRARY=$GITHUB_WORKSPACE/android-deps/lib/libz.a \
                -DZLIB_INCLUDE_DIR=$GITHUB_WORKSPACE/android-deps/include .
          make -j$(nproc)
          make install

      - name: Build amalyzer for Android
        run: |
          rm -rf build
          mkdir build && cd build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=${ANDROID_PLATFORM} \
            -DCMAKE_BUILD_TYPE=Release \
            -DTAGLIB_STATIC_ROOT=$GITHUB_WORKSPACE/android-deps \
            -DZLIB_STATIC=$GITHUB_WORKSPACE/android-deps/lib/libz.a
          cmake --build . --config Release

      - name: Strip binary
        run: |
          $ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip build/amalyzer

      - name: Package binary (ZIP)
        run: |
          mkdir -p release/amalyzer-${{ matrix.abi }}
          cp build/amalyzer release/amalyzer-${{ matrix.abi }}/
          cp README.md release/amalyzer-${{ matrix.abi }}/ 2>/dev/null || true
          echo "Built for Android ABI: ${{ matrix.abi }}" > release/amalyzer-${{ matrix.abi }}/ANDROID.txt
          cd release/amalyzer-${{ matrix.abi }}
          zip -r ../amalyzer-${{ matrix.abi }}.zip *

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: amalyzer-${{ matrix.abi }}
          path: release/amalyzer-${{ matrix.abi }}.zip
